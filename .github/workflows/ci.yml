name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and Validate the Library
    runs-on: ubuntu-latest
    # Allow the workflow to push extracted files back to PR branches from this
    # repo. Forks can't receive a write token, so we fall back to validate-only.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci

      # Unit-test the importer's shared catalog-merge policy (derived frontmatter
      # wins over the sidecar; undocumented keys are dropped) so the "silent
      # override" bug class can't regress.
      - name: Run unit tests
        run: npm test

      # Extract submissions in every PR checkout so the safety scan and Astro
      # build evaluate the exact generated Markdown a merge would publish.
      # Same-repo PRs can commit the generated artifacts back to their branch;
      # fork PR output stays ephemeral because forks never receive a write token.
      # Hard-fails on missing/invalid metadata.
      # `authorGithub` is resolved purely from each submission's own metadata
      # (an explicit handle, or a github.com/<login> authorUrl) — never the
      # PR/merger login — so attribution is stable no matter who lands the asset.
      - name: Import Submissions
        run: npm run import:submissions

      - name: Validate Generated Artwork
        run: npm run artwork:validate

      # Scan every generated page before committing importer output or running
      # Astro. The verifier renders Markdown as HTML, while leaving fenced and
      # inline code examples inert, and rejects active elements, handlers, and
      # dangerous URL protocols that must never reach the published gallery.
      - name: Reject Active Content in Generated Markdown
        run: npm run check:generated-content

      - name: Commit Generated Library Files
        if: github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if [ -n "$(git status --porcelain src/content/skills src/content/prompts src/content/artifacts src/content/artifact-payloads src/content/guides public/bundles public/assets.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/content/skills src/content/prompts src/content/artifacts src/content/artifact-payloads src/content/guides public/bundles public/assets.json
            git commit -m "chore: generate library submissions"
            git push
          else
            echo "No generated library changes to commit."
          fi

      # Retain an explicit check-only pass for fork submissions. Import and scan
      # above already exercise their generated output, but this keeps the
      # contributor-facing metadata validation result distinct in the job log.
      - name: Validate Submissions (Fork PRs)
        if: github.event.pull_request.head.repo.full_name != github.repository
        run: npm run check:submissions

      # `astro build` parses every generated library collection against its Zod
      # schema, so malformed or out-of-policy asset metadata fails the PR.
      - name: Build Site (Validates Library Content)
        run: npm run build

  guard-scope:
    name: Guard PR Scope (Site vs. Submissions)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      # Fail a PR that edits BOTH a submission (submissions/**) and the site /
      # repo config (workflows, scripts, Astro app, root config, etc.) in one go.
      # Submission content and infra/site changes must be reviewed and merged
      # separately so a reviewer can't accidentally approve a site change while
      # signing off on an asset (or vice versa). Add the `allow-mixed-changes`
      # label to intentionally override. Generated artifacts that CI itself
      # commits back to the branch (all generated content collections,
      # public/bundles, public/assets.json, and derived ratings) are ignored —
      # they aren't hand-authored site changes.
      - name: Detect Mixed Site and Submission Changes
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          set -euo pipefail
          if printf '%s' "$LABELS" | grep -q '"allow-mixed-changes"'; then
            echo "Label 'allow-mixed-changes' present — skipping scope guard."
            exit 0
          fi
          FILES="$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename')"
          echo "Changed files:"; printf '%s\n' "$FILES"
          SUBMISSION="$(printf '%s\n' "$FILES" | grep -E '^submissions/' || true)"
          SITE="$(printf '%s\n' "$FILES" \
            | grep -vE '^submissions/' \
            | grep -vE '^src/content/skills/' \
            | grep -vE '^src/content/prompts/' \
            | grep -vE '^src/content/artifacts/' \
            | grep -vE '^src/content/artifact-payloads/' \
            | grep -vE '^src/content/guides/' \
            | grep -vE '^public/bundles/' \
            | grep -vE '^public/assets\.json$' \
            | grep -vE '^src/data/ratings\.json$' \
            || true)"
          if [ -n "$SUBMISSION" ] && [ -n "$SITE" ]; then
            {
              echo "### ❌ This PR mixes submission content with site/repo changes"
              echo ""
              echo "Split them into **separate PRs** — one for the submission, one"
              echo "for the site/config change — so each can be reviewed on its own."
              echo "(To override intentionally, add the \`allow-mixed-changes\` label.)"
              echo ""
              echo "**Submission files:**"
              printf '%s\n' "$SUBMISSION" | sed 's/^/- `/; s/$/`/'
              echo ""
              echo "**Site / repo files:**"
              printf '%s\n' "$SITE" | sed 's/^/- `/; s/$/`/'
            } | tee -a "$GITHUB_STEP_SUMMARY"
            echo "::error::PR mixes submission content with site/repo changes — split into separate PRs or add the 'allow-mixed-changes' label."
            exit 1
          fi
          echo "Scope guard passed: PR touches submissions or site, not both."
