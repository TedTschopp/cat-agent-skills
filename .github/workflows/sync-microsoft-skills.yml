name: Sync Microsoft Catalog

on:
  schedule:
    - cron: "0 3 * * *"
      timezone: "America/Los_Angeles"
  workflow_dispatch:

# The bot adds new catalog entries to main, then explicitly dispatches the
# existing Pages workflow. GitHub intentionally does not emit push-triggered
# workflow runs for commits made with GITHUB_TOKEN.
permissions:
  contents: write
  actions: write

concurrency:
  group: sync-microsoft-catalog
  cancel-in-progress: false

jobs:
  sync:
    name: Copy and Validate Missing Submissions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MICROSOFT_REPOSITORY: https://github.com/microsoft/cat-agent-skills.git

    steps:
      - name: Check Out This Fork
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set Up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Fetch Microsoft Catalog
        run: |
          set -euo pipefail
          git remote add microsoft "$MICROSOFT_REPOSITORY"
          git fetch --no-tags --depth=1 microsoft main

      # This step reads Git objects directly and copies only first-level
      # submissions/<slug>/ directories that do not exist locally. It rejects
      # unsafe names, symlinks, generated-path collisions, and overwrites.
      - name: Find and Copy Missing Submissions
        id: sync
        run: npm run sync:upstream -- --upstream-ref microsoft/main

      - name: Install Dependencies
        if: steps.sync.outputs.needs_import == 'true'
        run: npm ci

      - name: Validate All Submission Sources
        if: steps.sync.outputs.needs_import == 'true'
        run: npm run check:submissions

      # Import only missing slugs. A full-tree import rewrites historical ZIPs;
      # the repeatable --slug filter keeps the automated change addition-only.
      - name: Generate Missing Library Entries
        if: steps.sync.outputs.needs_import == 'true'
        env:
          IMPORT_ARGS: ${{ steps.sync.outputs.import_args }}
        run: npm run import:submissions -- $IMPORT_ARGS

      # Markdown code samples stay inert, but active HTML and unsafe link/image
      # protocols must never reach Astro's renderer from an automated import.
      - name: Reject Active Content in Generated Markdown
        if: steps.sync.outputs.needs_import == 'true'
        run: npm run check:generated-content

      - name: Run Unit Tests
        if: steps.sync.outputs.needs_import == 'true'
        run: npm test

      - name: Validate Generated Library Metadata
        if: steps.sync.outputs.needs_import == 'true'
        run: |
          npm run validate:skills
          npm run validate:prompts
          npm run validate:artifacts

      - name: Validate Generated Artwork
        if: steps.sync.outputs.needs_import == 'true'
        run: npm run artwork:validate

      - name: Build the Production Site
        if: steps.sync.outputs.needs_import == 'true'
        run: npm run build

      - name: Enforce Addition-Only Submission Scope
        if: steps.sync.outputs.needs_import == 'true'
        id: scope
        env:
          NEW_SLUGS: ${{ steps.sync.outputs.new_submission_slugs }}
          GENERATED_SLUGS: ${{ steps.sync.outputs.pending_slugs }}
        run: |
          npm run check:upstream-sync-scope -- \
            --new-slugs "$NEW_SLUGS" \
            --generated-slugs "$GENERATED_SLUGS"

      - name: Commit and Push Validated Additions
        if: steps.scope.outputs.changed == 'true'
        env:
          BASE_SHA: ${{ github.sha }}
          UPSTREAM_SHA: ${{ steps.sync.outputs.upstream_sha }}
          NEW_SLUGS: ${{ steps.sync.outputs.new_submission_slugs }}
          GENERATED_SLUGS: ${{ steps.sync.outputs.pending_slugs }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Fail rather than rebase unvalidated content if main moved while this
          # job was running. The next scheduled/manual run can retry cleanly.
          git fetch --no-tags origin main
          if [ "$(git rev-parse origin/main)" != "$BASE_SHA" ]; then
            echo "::error::origin/main advanced during validation; refusing to push."
            exit 1
          fi

          git add -- submissions src/content/skills src/content/prompts src/content/artifacts src/content/artifact-payloads src/content/guides public/bundles public/assets.json
          git diff --cached --check
          git diff --cached --name-status

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit \
            -m "chore(catalog): sync Microsoft upstream submissions" \
            -m "Microsoft upstream: $UPSTREAM_SHA" \
            -m "New submissions: ${NEW_SLUGS:-none}" \
            -m "Generated entries: $GENERATED_SLUGS"
          gh auth setup-git
          git push origin HEAD:main

      # A GITHUB_TOKEN push does not trigger push workflows. workflow_dispatch
      # is the documented exception, so explicitly start the Pages release.
      - name: Dispatch Production Deployment
        if: steps.scope.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main

      - name: Report No-Op
        if: steps.sync.outputs.needs_import != 'true'
        run: echo "Microsoft has no submission directories or gallery entries missing from this fork."
