name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Refresh Microsoft and AI.Tedt.org reactions, comments, and repository stars
  # after the 03:00 Pacific catalog sync. The build and deploy only run when the
  # deterministic snapshots changed, so quiet days remain true no-ops.
  schedule:
    - cron: "30 3 * * *"
      timezone: "America/Los_Angeles"

permissions:
  contents: write # commit refreshed engagement snapshots back to main
  pages: write
  id-token: write
  discussions: read

# Allow one concurrent deployment, skipping runs queued between in-progress and latest.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.engagement.outputs.should_deploy }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Fetch community engagement
        id: engagement
        run: |
          npm run engagement:fetch
          if git diff --quiet -- src/data/engagement.json src/data/ratings.json; then
            changed=false
          else
            changed=true
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          # Always build/deploy on code pushes and manual runs; on the daily
          # cron, only when the engagement snapshots actually changed.
          if [ "${{ github.event_name }}" != "schedule" ] || [ "$changed" = "true" ]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            echo "No engagement changes on scheduled run; skipping build and deploy."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Persist refreshed engagement
        if: steps.engagement.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/engagement.json src/data/ratings.json
          git commit -m "chore(engagement): refresh community snapshots"
          # A GITHUB_TOKEN push does not retrigger workflows, so this run still
          # owns the deploy below; the commit only keeps tomorrow's diff stable.
          git push || echo "::warning::Could not push refreshed engagement; will retry next run."
      # Regenerate every skill page + bundle from submissions/ before building.
      # PR CI only commits generated content back to same-repo PR branches. Fork
      # PRs generate and scan their artifacts in an ephemeral checkout, so those
      # files never land on main. Importing here makes the deployed site reflect
      # submissions/ regardless of how a PR was merged. Idempotent: it rewrites
      # the same files a same-repo PR did.
      - name: Import skill submissions
        if: steps.engagement.outputs.should_deploy == 'true'
        run: npm run import:submissions
      - name: Reject active content in generated Markdown
        if: steps.engagement.outputs.should_deploy == 'true'
        run: |
          set -euo pipefail
          GENERATED_SLUGS="$(
            find src/content/skills -maxdepth 1 -type f -name '*.md' -print \
              | sed 's#^src/content/skills/##; s#\.md$##' \
              | LC_ALL=C sort \
              | paste -sd, -
          )"
          npm run check:upstream-rendered-content -- \
            --generated-slugs "$GENERATED_SLUGS"
      - name: Build
        if: steps.engagement.outputs.should_deploy == 'true'
        run: npm run build
        env:
          PUBLIC_LOCAL_GISCUS_ENABLED: ${{ vars.PUBLIC_LOCAL_GISCUS_ENABLED }}
      - name: Upload Pages artifact
        if: steps.engagement.outputs.should_deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: needs.build.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      # deploy-pages hard-caps its polling at 10 minutes and cancels at that
      # boundary, even when Pages finishes the deployment shortly afterward.
      - name: Verify Pages deployment after action timeout
        if: steps.deployment.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..120}; do
            if ! status="$(gh api "repos/${GITHUB_REPOSITORY}/pages/deployments/${GITHUB_SHA}" --jq '.status')"; then
              echo "::warning::Could not read Pages deployment status (attempt ${attempt}/120)."
              sleep 5
              continue
            fi

            case "$status" in
              succeed)
                echo "Pages deployment succeeded after the action timeout."
                exit 0
                ;;
              deployment_failed|deployment_perms_error|deployment_content_failed|deployment_lost)
                echo "::error::Pages deployment ended with status: $status"
                exit 1
                ;;
              *)
                echo "Pages deployment status: $status (attempt ${attempt}/120)"
                sleep 5
                ;;
            esac
          done

          echo "::error::Pages deployment did not succeed within 10 additional minutes."
          exit 1
